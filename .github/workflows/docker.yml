name: Docker

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - 'docker/Dockerfile'
      - '.github/workflows/docker.yml'
  release:
    types:
      - released
  workflow_dispatch:

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          if [ ${{ github.event_name == 'schedule'}} ]: then
            echo "matrix={\"distro\":[\"focal\", \"jammy\", \"noble\"],"nth_last_tag":[0, 1, 2, 3, 4, 5]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"distro\":[\"focal\", \"jammy\", \"noble\"],"nth_last_tag":[0,]}" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: set-matrix
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      PUSH_DOCKER_IMAGE: ${{ github.ref == 'refs/heads/master' || github.event_name == 'release' || github.event_name == 'schedule' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get repository ref
        id: get-ref
        run: echo "REF=$(git tag | tail -${{ matrix.nth_last_tag }} | head -1)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get-ref.outputs.REF }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker meta-information
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            prefix=
            suffix=
          tags: |
            type=ref,event=branch,prefix=${{ matrix.distro }}-
            type=ref,event=pr,prefix=${{ matrix.distro }}-
            type=semver,pattern={{major}}.{{minor}},prefix=${{ matrix.distro }}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          build-args: TAG=${{ matrix.distro }}
          push: ${{ env.PUSH_DOCKER_IMAGE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
